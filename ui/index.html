<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f2" />
    <meta name="application-name" content="PADStudio" />
    <meta name="apple-mobile-web-app-title" content="PADStudio" />
    <link rel="icon" type="image/png" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>PADStudio</title>
    <link rel="preload" href="/fonts/manrope-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Đến nội dung</a>

    <header id="topbar" class="topbar">
      <a class="brand" href="/" aria-label="PADStudio — Precise Animated Demonstration Studio">
        <img class="brand-mark" src="/brand/padstudio-mark.webp" width="64" height="34" alt="" />
        <span class="brand-copy">
          <span class="brand-name">PAD<span>Studio</span></span>
          <span class="brand-tagline">Precise Animated Demonstration Studio</span>
        </span>
      </a>
      <div class="topbar-actions">
        <button id="library-button" type="button" class="button button-ghost" aria-haspopup="dialog" aria-expanded="false" aria-label="Mở danh sách dự án">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
          <span class="button-label">Dự án</span>
          <span id="library-count" class="count" aria-hidden="true">0</span>
        </button>
        <button id="theme-toggle" type="button" class="icon-button" aria-label="Chuyển sang giao diện tối" aria-pressed="false"></button>
      </div>
    </header>

    <main id="main" class="page" tabindex="-1">
      <div id="app-error" class="toast" role="alert" hidden>
        <span id="app-error-text"></span>
        <button id="retry-button" type="button" class="button button-quiet">Thử lại</button>
      </div>
      <span id="connection-status" class="sr-only" role="status">Đang kết nối</span>

      <section id="welcome" class="welcome" hidden>
        <img class="brand-art" src="/brand/padstudio-mark-large.webp" width="640" height="335" alt="" />
        <h1>Chào mừng đến PADStudio</h1>
        <p>Bắt đầu một dự án trong cuộc trò chuyện với Agent. Tư liệu, bản dựng và phản hồi của bạn sẽ xuất hiện ở đây.</p>
        <p class="welcome-name">Precise Animated Demonstration Studio</p>
      </section>

      <div id="project" hidden>
        <div class="project-bar">
          <div class="project-heading">
            <h1 id="project-title" tabindex="-1">Đang mở dự án…</h1>
            <p id="project-meta" class="project-meta"></p>
          </div>
          <div id="tabs" class="tabs" role="tablist" aria-label="Nội dung dự án">
            <button id="tab-video" type="button" role="tab" class="tab is-active" data-view="video" aria-selected="true" aria-controls="view-video">Video</button>
            <button id="tab-sources" type="button" role="tab" class="tab" data-view="sources" aria-selected="false" tabindex="-1" aria-controls="view-sources">Tư liệu</button>
          </div>
        </div>

        <section id="view-video" class="view" role="tabpanel" aria-labelledby="tab-video">
          <div id="theatre"></div>
        </section>

        <section id="view-sources" class="view" role="tabpanel" aria-labelledby="tab-sources" hidden>
          <div id="sources"></div>
        </section>
      </div>
    </main>

    <div id="library" class="library" role="dialog" aria-modal="true" aria-labelledby="library-title" hidden>
      <div class="library-backdrop" data-library-backdrop></div>
      <div class="library-sheet">
        <header class="library-head">
          <h2 id="library-title">Dự án</h2>
          <button type="button" class="icon-button" data-library-close aria-label="Đóng danh sách dự án">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </header>
        <label class="search library-search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16l4 4M10.5 17a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13z" /></svg>
          <input id="library-search" type="search" placeholder="Tìm dự án…" aria-label="Tìm dự án" autocomplete="off" />
        </label>
        <div id="library-grid" class="library-grid"></div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
