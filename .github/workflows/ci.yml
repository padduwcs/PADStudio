name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on Node.js 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Fetching LFS here makes a missing remote object fail CI instead of
          # accepting a syntactically valid pointer to unavailable media.
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install FFmpeg
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffmpeg -version

      - name: Enforce media storage policy
        run: node scripts/check-media-policy.mjs

      - name: Verify fetched Git LFS objects
        run: git lfs fsck --objects HEAD

      - name: Run unit and integration tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate Motion Canvas workspace
        run: npm run validate:motion

      - name: Validate synchronized workspace
        run: npm run validate:sync

      - name: Smoke-test sync player in Chrome
        shell: bash
        run: |
          chrome=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if chrome_path="$(command -v "$candidate")"; then
              chrome="$chrome_path"
              break
            fi
          done
          if [[ -z "$chrome" ]]; then
            echo "Chrome/Chromium is not available on this runner." >&2
            exit 1
          fi
          npm run validate:sync -- --browser "$chrome"

      - name: Verify validation leaves the worktree clean
        if: always()
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "$status"
            exit 1
          fi
