name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # PADStudio targets Windows, and several tests drive real FFmpeg and a local browser.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Tests render and probe real media. The optional Python analysis runtime (scene detection,
      # ASR) is not installed here, so the tests that need it are reported as skipped with a reason.
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Show tool versions
        run: |
          node --version
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Static checks
        run: npm run check

      # The spec reporter writes the usual log; the GitHub reporter turns each failing test into an annotation,
      # which the run page and the public API show without the admin-only log download.
      - name: Run tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/lib/github-test-reporter.mjs --test-reporter-destination=stdout

      # Chrome/Edge is available on windows-latest. These suites use temporary projects,
      # a deterministic Codex peer and simulated providers; no accounts or secrets are needed.
      - name: Browser acceptance (observer, workspace and chat)
        run: npm run test:ui

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .cache/ui-focus-review/
            .cache/ui-polish/live/
            .cache/tools-ui/
            .cache/workspace-ui/
            .cache/chat-ui/
            .cache/chat-features-ui/
